name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      is_main_release_tag: ${{ steps.gate.outputs.is_main_release_tag }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate annotated tag targets main history
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "is_main_release_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_TYPE="$(git cat-file -t "$GITHUB_REF" 2>/dev/null || true)"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "is_main_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "::error::${GITHUB_REF_NAME} must be an annotated tag."
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TARGET="$(git rev-list -n 1 "$GITHUB_REF")"
          if ! git merge-base --is-ancestor "$TARGET" origin/main; then
            echo "is_main_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "::error::${GITHUB_REF_NAME} targets ${TARGET}, which is not in origin/main history."
            exit 1
          fi

          echo "is_main_release_tag=true" >> "$GITHUB_OUTPUT"
          echo "${GITHUB_REF_NAME} targets ${TARGET} in origin/main history."

  jvm:
    name: JVM (JDK 21)
    needs: [validate-release-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22 for embedded settings UI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build settings UI (required for JCEF bundle)
        run: |
          npm install
          npm run build:settings-ui

      - name: Unit tests
        run: ./gradlew :core:test :plugin:test --stacktrace

  js:
    name: JS (core-ts + settings-ui + vscode)
    needs: [validate-release-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      # settings-ui tests inspect the real Vite output, so generate it before test:js.
      - name: Build settings UI for artifact tests
        run: npm run build:settings-ui

      - name: JS tests (core-ts + settings-ui)
        run: npm run test:js

      - name: Build JS packages
        run: npm run build:js

  package-jetbrains:
    name: Package signed JetBrains ZIP
    needs: [validate-release-tag, jvm]
    if: needs.validate-release-tag.outputs.is_main_release_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22 for embedded settings UI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build settings UI (required for JCEF bundle)
        run: |
          npm install
          npm run build:settings-ui

      # Distribution ZIP is always signed and only release tags can package it.
      - name: Build and sign plugin ZIP
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          DIST="apps/jetbrains/plugin/build/distributions"
          if [ -z "${CERTIFICATE_CHAIN:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
            echo "::error::CERTIFICATE_CHAIN and PRIVATE_KEY secrets are required to build the JetBrains distribution ZIP."
            exit 1
          fi
          ./gradlew :plugin:buildPlugin :plugin:signPlugin --stacktrace
          SIGNED="$(ls -1t "$DIST"/*-signed.zip 2>/dev/null | head -1 || true)"
          if [ -z "$SIGNED" ]; then
            echo "::error::signPlugin did not produce a *-signed.zip under $DIST"
            ls -la "$DIST" || true
            exit 1
          fi
          # Keep only the signed archive for upload / Release (no unsigned ZIP).
          find "$DIST" -type f -name '*.zip' ! -name '*-signed.zip' -delete
          echo "Signed ZIP: $SIGNED"
          ls -la "$DIST"

      - name: Verify signed ZIP embeds settings UI
        run: |
          python3 - <<'PY2'
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile
          archives = list(Path("apps/jetbrains/plugin/build/distributions").glob("*-signed.zip"))
          assert archives, "signed plugin ZIP was not produced"
          with ZipFile(max(archives, key=lambda p: p.stat().st_mtime)) as outer:
              for name in outer.namelist():
                  if not name.endswith(".jar"):
                      continue
                  with ZipFile(BytesIO(outer.read(name))) as jar:
                      entries = set(jar.namelist())
                      if "settings-ui/index.html" in entries and any(e.startswith("settings-ui/assets/") for e in entries):
                          print(f"embedded settings UI verified in {name}")
                          break
              else:
                  raise AssertionError("signed ZIP is missing packaged settings-ui assets")
          PY2

      - name: Upload signed ZIP distribution
        uses: actions/upload-artifact@v4
        with:
          name: auto-complete-zip
          path: apps/jetbrains/plugin/build/distributions/*-signed.zip
          if-no-files-found: error

  package-vscode:
    name: Package VS Code VSIX
    needs: [validate-release-tag, js]
    if: needs.validate-release-tag.outputs.is_main_release_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Build JS packages
        run: npm run build:js

      - name: Package VS Code extension
        run: npm run package:vscode

      - name: Upload VSIX distribution
        uses: actions/upload-artifact@v4
        with:
          name: auto-complete-vsix
          path: apps/vscode/extension/dist-vsix/*.vsix
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [validate-release-tag, package-jetbrains, package-vscode]
    runs-on: ubuntu-latest
    if: needs.validate-release-tag.outputs.is_main_release_tag == 'true'
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download signed ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: auto-complete-zip
          path: release-assets

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: auto-complete-vsix
          path: release-assets

      - name: Check whether this tag already has a release
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release for $TAG already exists; publication will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release and upload packages
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # Prefer signed JB zip only; fail if missing.
          if ! ls release-assets/*-signed.zip >/dev/null 2>&1; then
            echo "::error::Expected *-signed.zip in release assets"
            ls -la release-assets || true
            exit 1
          fi
          gh release create "$TAG" release-assets/*-signed.zip release-assets/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --title "Auto Complete $VERSION" \
            --generate-notes

  # Optional Marketplace API publish on validated main release tags when PUBLISH_TOKEN is set.
  marketplace:
    name: Publish JetBrains Marketplace
    needs: [validate-release-tag, package-jetbrains]
    runs-on: ubuntu-latest
    if: needs.validate-release-tag.outputs.is_main_release_tag == 'true'
    # Uncomment for manual approval:
    # environment: marketplace
    permissions:
      contents: read
    concurrency:
      group: marketplace-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build settings UI
        run: |
          npm install
          npm run build:settings-ui

      - name: Sign and publish
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_CHAIN:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
            echo "Skip Marketplace: signing secrets not configured."
            exit 0
          fi
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "Skip Marketplace: PUBLISH_TOKEN not configured (manual Marketplace UI is OK)."
            exit 0
          fi
          ./gradlew :plugin:publishPlugin --stacktrace
