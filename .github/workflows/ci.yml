name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly compatibility check against recommended IntelliJ IDEA releases/EAPs.
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      is_main_release_tag: ${{ steps.gate.outputs.is_main_release_tag }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate annotated tag targets main history
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "is_main_release_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          # Checkout may leave an annotated tag ref peeled to its commit; fetch the tag object explicitly.
          git fetch --force origin "${TAG_REF}:${TAG_REF}"
          TAG_TYPE="$(git cat-file -t "$TAG_REF" 2>/dev/null || true)"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "is_main_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "::error::${GITHUB_REF_NAME} must be an annotated tag."
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TARGET="$(git rev-list -n 1 "${TAG_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$TARGET" origin/main; then
            echo "is_main_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "::error::${GITHUB_REF_NAME} targets ${TARGET}, which is not in origin/main history."
            exit 1
          fi

          echo "is_main_release_tag=true" >> "$GITHUB_OUTPUT"
          echo "${GITHUB_REF_NAME} targets ${TARGET} in origin/main history."

  jvm:
    name: JVM (JDK 21)
    needs: [validate-release-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22 for embedded settings UI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build settings UI (required for JCEF bundle)
        run: |
          npm install
          npm run build:settings-ui

      - name: Unit tests
        run: ./gradlew :core:test :plugin:test --stacktrace

      # Build unsigned ZIP for integrity verification only (never uploaded as a release artifact).
      - name: Build unsigned plugin ZIP for integrity check
        run: ./gradlew :plugin:buildPlugin --stacktrace

      - name: Verify unsigned ZIP integrity
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile

          archives = [
              p for p in Path("apps/jetbrains/plugin/build/distributions").glob("auto-complete-*.zip")
              if not p.name.endswith("-signed.zip")
          ]
          assert archives, "unsigned plugin ZIP was not produced"
          target = max(archives, key=lambda p: p.stat().st_mtime)
          forbidden = []
          found_settings_ui = False
          found_plugin_xml = False
          change_notes_text = ""

          with ZipFile(target) as outer:
              for name in outer.namelist():
                  base = Path(name).name.lower()
                  if (base.startswith("kotlin-stdlib") or base.startswith("annotations-")) and base.endswith(".jar"):
                      forbidden.append(name)
                  if not name.endswith(".jar"):
                      continue
                  with ZipFile(BytesIO(outer.read(name))) as jar:
                      entries = set(jar.namelist())
                      if "settings-ui/index.html" in entries and any(e.startswith("settings-ui/assets/") for e in entries):
                          found_settings_ui = True
                          print(f"embedded settings UI verified in {name}")
                      if "META-INF/plugin.xml" in entries:
                          found_plugin_xml = True
                          root = ET.fromstring(jar.read("META-INF/plugin.xml"))
                          raw_notes = root.findtext("change-notes") or ""
                          change_notes_text = " ".join(re.sub(r"<[^>]+>", " ", raw_notes).split())

          assert not forbidden, f"forbidden bundled JAR(s) in ZIP: {forbidden}"
          assert found_settings_ui, "ZIP is missing packaged settings-ui/index.html or settings-ui/assets/*"
          assert found_plugin_xml, "ZIP is missing META-INF/plugin.xml"
          assert change_notes_text, "META-INF/plugin.xml <change-notes> is empty"
          assert change_notes_text.lower() != "open-source preview build.", (
              "META-INF/plugin.xml <change-notes> still uses placeholder text"
          )
          print(f"ZIP integrity verified for {target.name}")
          PY

  verify-plugin:
    name: Verify JetBrains plugin compatibility
    needs: [validate-release-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22 for embedded settings UI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build settings UI (required for JCEF bundle)
        run: |
          npm install
          npm run build:settings-ui

      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew :plugin:verifyPlugin --stacktrace

  js:
    name: JS (core-ts + settings-ui + vscode)
    needs: [validate-release-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Typecheck JS packages (tsc + vue-tsc)
        run: npm run typecheck:js

      - name: JS tests (core-ts + settings-ui + vscode)
        run: npm run test:js

      - name: Build JS packages
        run: npm run build:js

  package-jetbrains:
    name: Package signed JetBrains ZIP
    needs: [validate-release-tag, jvm, verify-plugin]
    if: needs.validate-release-tag.outputs.is_main_release_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22 for embedded settings UI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build settings UI (required for JCEF bundle)
        run: |
          npm install
          npm run build:settings-ui

      # Distribution ZIP is always signed and only release tags can package it.
      - name: Build and sign plugin ZIP
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          DIST="apps/jetbrains/plugin/build/distributions"
          if [ -z "${CERTIFICATE_CHAIN:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
            echo "::error::CERTIFICATE_CHAIN and PRIVATE_KEY secrets are required to build the JetBrains distribution ZIP."
            exit 1
          fi
          ./gradlew :plugin:buildPlugin :plugin:signPlugin --stacktrace
          SIGNED="$(ls -1t "$DIST"/*-signed.zip 2>/dev/null | head -1 || true)"
          if [ -z "$SIGNED" ]; then
            echo "::error::signPlugin did not produce a *-signed.zip under $DIST"
            ls -la "$DIST" || true
            exit 1
          fi
          # Keep only the signed archive for upload / Release (no unsigned ZIP).
          find "$DIST" -type f -name '*.zip' ! -name '*-signed.zip' -delete
          echo "Signed ZIP: $SIGNED"
          ls -la "$DIST"

      - name: Verify signed ZIP integrity
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile

          archives = list(Path("apps/jetbrains/plugin/build/distributions").glob("*-signed.zip"))
          assert archives, "signed plugin ZIP was not produced"
          target = max(archives, key=lambda p: p.stat().st_mtime)
          forbidden = []
          found_settings_ui = False
          found_plugin_xml = False
          change_notes_text = ""

          with ZipFile(target) as outer:
              for name in outer.namelist():
                  base = Path(name).name.lower()
                  if (base.startswith("kotlin-stdlib") or base.startswith("annotations-")) and base.endswith(".jar"):
                      forbidden.append(name)
                  if not name.endswith(".jar"):
                      continue
                  with ZipFile(BytesIO(outer.read(name))) as jar:
                      entries = set(jar.namelist())
                      if "settings-ui/index.html" in entries and any(e.startswith("settings-ui/assets/") for e in entries):
                          found_settings_ui = True
                          print(f"embedded settings UI verified in {name}")
                      if "META-INF/plugin.xml" in entries:
                          found_plugin_xml = True
                          root = ET.fromstring(jar.read("META-INF/plugin.xml"))
                          raw_notes = root.findtext("change-notes") or ""
                          change_notes_text = " ".join(re.sub(r"<[^>]+>", " ", raw_notes).split())

          assert not forbidden, f"forbidden bundled JAR(s) in signed ZIP: {forbidden}"
          assert found_settings_ui, "signed ZIP is missing packaged settings-ui/index.html or settings-ui/assets/*"
          assert found_plugin_xml, "signed ZIP is missing META-INF/plugin.xml"
          assert change_notes_text, "META-INF/plugin.xml <change-notes> is empty"
          assert change_notes_text.lower() != "open-source preview build.", (
              "META-INF/plugin.xml <change-notes> still uses placeholder text"
          )
          print(f"signed ZIP integrity verified for {target.name}")
          PY

      - name: Upload signed ZIP distribution
        uses: actions/upload-artifact@v4
        with:
          name: auto-complete-zip
          path: apps/jetbrains/plugin/build/distributions/*-signed.zip
          if-no-files-found: error

  package-vscode:
    name: Package VS Code VSIX
    needs: [validate-release-tag, js]
    if: needs.validate-release-tag.outputs.is_main_release_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Build JS packages
        run: npm run build:js

      - name: Package VS Code extension
        run: npm run package:vscode

      - name: Upload VSIX distribution
        uses: actions/upload-artifact@v4
        with:
          name: auto-complete-vsix
          path: apps/vscode/extension/dist-vsix/*.vsix
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [validate-release-tag, package-jetbrains, package-vscode]
    runs-on: ubuntu-latest
    if: needs.validate-release-tag.outputs.is_main_release_tag == 'true'
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download signed ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: auto-complete-zip
          path: release-assets

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: auto-complete-vsix
          path: release-assets

      - name: Create or update release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Prefer signed JB zip only; fail if missing.
          if ! ls release-assets/*-signed.zip >/dev/null 2>&1; then
            echo "::error::Expected *-signed.zip in release assets"
            ls -la release-assets || true
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing release assets with latest packages."
            gh release upload "$TAG" release-assets/*-signed.zip release-assets/*.vsix \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" release-assets/*-signed.zip release-assets/*.vsix \
              --repo "$GITHUB_REPOSITORY" \
              --title "Auto Complete $VERSION" \
              --generate-notes
          fi

  # Optional Marketplace API publish on validated main release tags when PUBLISH_TOKEN is set.
  marketplace:
    name: Publish JetBrains Marketplace
    needs: [validate-release-tag, package-jetbrains]
    runs-on: ubuntu-latest
    if: needs.validate-release-tag.outputs.is_main_release_tag == 'true'
    # Uncomment for manual approval:
    # environment: marketplace
    permissions:
      contents: read
    concurrency:
      group: marketplace-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22 for embedded settings UI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Marketplace publish secrets
        id: secrets_check
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_CHAIN:-}" ] || [ -z "${PRIVATE_KEY:-}" ]; then
            echo "Skip Marketplace: signing secrets not configured."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${PUBLISH_TOKEN:-}" ]; then
            echo "Skip Marketplace: PUBLISH_TOKEN not configured (manual Marketplace UI is OK)."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Build settings UI
        if: steps.secrets_check.outputs.should_publish == 'true'
        run: |
          npm install
          npm run build:settings-ui

      - name: Build and sign plugin ZIP
        if: steps.secrets_check.outputs.should_publish == 'true'
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew :plugin:buildPlugin :plugin:signPlugin --stacktrace

      - name: Verify signed ZIP integrity before publish
        if: steps.secrets_check.outputs.should_publish == 'true'
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile

          archives = list(Path("apps/jetbrains/plugin/build/distributions").glob("*-signed.zip"))
          assert archives, "signed plugin ZIP was not produced"
          target = max(archives, key=lambda p: p.stat().st_mtime)
          forbidden = []
          found_settings_ui = False
          found_plugin_xml = False
          change_notes_text = ""

          with ZipFile(target) as outer:
              for name in outer.namelist():
                  base = Path(name).name.lower()
                  if (base.startswith("kotlin-stdlib") or base.startswith("annotations-")) and base.endswith(".jar"):
                      forbidden.append(name)
                  if not name.endswith(".jar"):
                      continue
                  with ZipFile(BytesIO(outer.read(name))) as jar:
                      entries = set(jar.namelist())
                      if "settings-ui/index.html" in entries and any(e.startswith("settings-ui/assets/") for e in entries):
                          found_settings_ui = True
                          print(f"embedded settings UI verified in {name}")
                      if "META-INF/plugin.xml" in entries:
                          found_plugin_xml = True
                          root = ET.fromstring(jar.read("META-INF/plugin.xml"))
                          raw_notes = root.findtext("change-notes") or ""
                          change_notes_text = " ".join(re.sub(r"<[^>]+>", " ", raw_notes).split())

          assert not forbidden, f"forbidden bundled JAR(s) in signed ZIP: {forbidden}"
          assert found_settings_ui, "signed ZIP is missing packaged settings-ui/index.html or settings-ui/assets/*"
          assert found_plugin_xml, "signed ZIP is missing META-INF/plugin.xml"
          assert change_notes_text, "META-INF/plugin.xml <change-notes> is empty"
          assert change_notes_text.lower() != "open-source preview build.", (
              "META-INF/plugin.xml <change-notes> still uses placeholder text"
          )
          print(f"signed ZIP integrity verified before publish for {target.name}")
          PY

      - name: Publish to JetBrains Marketplace
        if: steps.secrets_check.outputs.should_publish == 'true'
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew :plugin:publishPlugin --stacktrace
