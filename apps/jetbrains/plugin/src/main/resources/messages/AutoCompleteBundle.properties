settings.web.jcef.title=Settings panel needs the embedded browser (JCEF)
settings.web.jcef.intro=Auto Complete settings and logs use an embedded Chromium panel (JCEF). Inline completion can still work if you already configured a profile; this panel cannot open until JCEF is available.
settings.web.jcef.whatMissing=What is missing
settings.web.jcef.missing.classes=JCEF UI classes are not on the classpath. On IntelliJ 2026+ install/enable the bundled plugin “Web Browser (JCEF)” (id: com.intellij.modules.jcef). On 2024.2–2025.x use a JetBrains Runtime that includes JCEF (the official IDE download).
settings.web.jcef.missing.modulePresentButClasses=The “Web Browser (JCEF)” module is listed, but JBCef classes are still unreachable. Restart the IDE after enabling the plugin. If it persists, reinstall the IDE or use Help → Find Action → “Choose Boot Java Runtime” and pick a JetBrains Runtime with JCEF.
settings.web.jcef.missing.registryOff=The IDE Registry flag ide.browser.jcef.enabled is off (or JCEF is blocked in this environment).
settings.web.jcef.missing.mountFailed=JCEF classes were found but the embedded browser failed to start (disabled, headless, or native init error).
settings.web.jcef.missing.bundle=The settings-ui web bundle is missing from this plugin package (development rebuild needed).
settings.web.jcef.stepsTitle=What to do
settings.web.jcef.step.enablePlugin=Settings → Plugins → Installed: enable “Web Browser (JCEF)”. If missing, search Marketplace for the same name (2026+ only; not available for 2024.2).
settings.web.jcef.step.restart=Fully restart the IDE (not only “Reload from Disk”).
settings.web.jcef.step.jbr=Confirm the IDE runs on JetBrains Runtime with JCEF: Help → About (or Find Action → “Choose Boot Java Runtime”). Avoid plain OpenJDK without JCEF for 2024.2–2025.x.
settings.web.jcef.step.registry=Find Action → Registry… → ensure ide.browser.jcef.enabled is checked. Uncheck only if you intentionally disabled the browser.
settings.web.jcef.step.rebuild=From the repo: npm run build:settings-ui && ./gradlew :plugin:buildPlugin (or ./scripts/package-local.sh), then reinstall the ZIP.
settings.web.jcef.step.reinstall=Install a fresh plugin build from Marketplace or a signed GitHub Release ZIP.
settings.web.jcef.noteCompletion=Note: inline completion does not require this panel if a profile is already saved. Only Settings / Logs need JCEF.
