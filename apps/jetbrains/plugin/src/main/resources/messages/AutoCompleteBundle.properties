# Swing recovery panel when JCEF / settings Web UI cannot load (must not depend on JCEF)
settings.web.jcef.title=Settings panel needs the embedded browser (JCEF)
settings.web.jcef.intro=Auto Complete settings and logs use an embedded Chromium panel (JCEF). Inline completion can still work if you already configured a profile; this panel cannot open until JCEF is available.
settings.web.jcef.whatMissing=What is missing
settings.web.jcef.missing.classes=JCEF UI classes are not on the classpath. On IntelliJ 2026+ enable the bundled plugin “Web Browser (JCEF)” (id: com.intellij.modules.jcef). On 2024.2–2025.x use a JetBrains Runtime that includes JCEF (the official IDE download).
settings.web.jcef.missing.legacyJbr=JCEF UI classes are not on the classpath. On IntelliJ 2024.2–2025.2 JCEF is built into the JetBrains Runtime (JBR), not a separate plugin. Switch the boot runtime to a JetBrains Runtime with JCEF.
settings.web.jcef.missing.splitPlugin=The bundled “Web Browser (JCEF)” plugin (id: com.intellij.modules.jcef) is disabled or not loaded on this IntelliJ 2026.2+ build. Enable it under Settings → Plugins → Installed and restart the IDE.
settings.web.jcef.missing.modulePresentButClasses=The “Web Browser (JCEF)” module is listed, but JBCef classes are still unreachable. Ensure the plugin is enabled and fully restart the IDE. If it persists, choose a JetBrains Runtime with JCEF via Help → Find Action → “Choose Boot Java Runtime”.
settings.web.jcef.missing.registryOff=The IDE Registry flag ide.browser.jcef.enabled is off (or JCEF is blocked in this environment).
settings.web.jcef.missing.mountFailed=JCEF classes were found but the embedded browser failed to start (disabled, headless, or native init error).
settings.web.jcef.missing.bundle=The settings-ui web bundle is missing from this plugin package (development rebuild needed).
settings.web.jcef.stepsTitle=What to do
settings.web.jcef.step.enablePlugin=Settings → Plugins → Installed: enable “Web Browser (JCEF)”. If missing, search Marketplace for the same name (2026+ only; not available separately for 2024.2–2025.2).
settings.web.jcef.step.restart=Fully restart the IDE (not only “Reload from Disk”).
settings.web.jcef.step.jbr=Confirm the IDE runs on JetBrains Runtime with JCEF: Help → About (or Find Action → “Choose Boot Java Runtime”). Avoid plain OpenJDK without JCEF.
settings.web.jcef.step.registry=Find Action → Registry… → ensure ide.browser.jcef.enabled is checked. Uncheck only if you intentionally disabled the browser.
settings.web.jcef.step.rebuild=From the repo: npm run build:settings-ui && ./gradlew :plugin:buildPlugin (or ./scripts/package-local.sh), then reinstall the ZIP.
settings.web.jcef.step.reinstall=Install a fresh plugin build from Marketplace or a signed GitHub Release ZIP.
settings.web.jcef.noteCompletion=Note: inline completion does not require this panel if a profile is already saved. Only Settings / Logs need JCEF.
settings.web.jcef.env=Environment: {0}
settings.web.jcef.envFlags=JCEF classes: {0} · Web Browser (JCEF) module: {1} · Registry ide.browser.jcef.enabled: {2}
settings.web.jcef.moduleBundledInPlatform=platform/JBR
settings.web.jcef.disabled=disabled
settings.web.jcef.detail=Technical detail
settings.web.jcef.yes=yes
settings.web.jcef.no=no
settings.web.jcef.unknown=n/a
