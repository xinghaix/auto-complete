settings.web.jcef.action.plugins.tooltip=Open IDE settings filtered to Plugins so you can enable Web Browser (JCEF)
settings.web.jcef.action.guide=Open user guide
settings.web.jcef.action.guide.tooltip=Open docs/GUIDE.md in your browser
settings.web.jcef.action.retry=Retry
settings.web.jcef.action.retry.tooltip=Try loading the settings panel again after enabling JCEF
# Legacy JCEF keys (retained for compatibility)
settings.web.jcefDisabled=Embedded browser (JCEF) is disabled (Registry / headless). Enable JCEF and restart. Settings are Web-only.
settings.web.jcefUnavailable=JCEF classes are not on the classpath. On IDEA 2026+ enable the bundled “Web Browser (JCEF)” plugin and restart. On 2024.2 use a JetBrains Runtime with JCEF.
settings.web.jcefFailed=Failed to start the embedded settings browser (JCEF). On newer IDEs enable “Web Browser (JCEF)”. Details below.
settings.web.bundleMissing=settings-ui bundle is missing from the plugin package. Rebuild with npm run build:settings-ui then ./gradlew :plugin:buildPlugin.
