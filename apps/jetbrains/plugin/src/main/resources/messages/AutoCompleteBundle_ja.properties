# Swing recovery when JCEF is unavailable
settings.web.jcef.title=設定パネルには埋め込みブラウザ（JCEF）が必要です
settings.web.jcef.intro=Auto Complete の設定とログは埋め込み Chromium（JCEF）を使います。プロファイル済みならインライン補完は動作しますが、JCEF が使えるまでこのパネルは開けません。
settings.web.jcef.whatMissing=不足しているもの
settings.web.jcef.missing.classes=クラスパスに JCEF UI クラスがありません。IntelliJ 2026+ では同梱の「Web Browser (JCEF)」（id: com.intellij.modules.jcef）を有効にしてください。2024.2–2025.x では JCEF 付き JetBrains Runtime（公式 IDE）を使ってください。
settings.web.jcef.missing.legacyJbr=クラスパスに JCEF UI クラスがありません。IntelliJ 2024.2–2025.2 では JCEF は別プラグインではなく JetBrains Runtime（JBR）に内蔵されています。JCEF 付きの JetBrains Runtime に切り替えてください。
settings.web.jcef.missing.splitPlugin=この IntelliJ 2026.2+ 環境では同梱プラグイン「Web Browser (JCEF)」（id: com.intellij.modules.jcef）が無効化または未読み込みです。「設定 → プラグイン → インストール済み」から有効にして IDE を再起動してください。
settings.web.jcef.missing.modulePresentButClasses=「Web Browser (JCEF)」モジュールはありますが JBCef クラスに到達できません。プラグイン有効化後に IDE を完全再起動してください。続く場合は Find Action →「Choose Boot Java Runtime」で JCEF 付き Runtime を選んでください。
settings.web.jcef.missing.registryOff=Registry の ide.browser.jcef.enabled がオフです（またはこの環境で JCEF が無効です）。
settings.web.jcef.missing.mountFailed=JCEF クラスは見つかりましたが、埋め込みブラウザの起動に失敗しました（無効・ヘッドレス・ネイティブ初期化エラー）。
settings.web.jcef.missing.bundle=このプラグインパッケージに settings-ui バンドルがありません（開発時は再ビルドが必要です）。
settings.web.jcef.stepsTitle=手順
settings.web.jcef.step.enablePlugin=設定 → プラグイン → インストール済み：「Web Browser (JCEF)」を有効化。無い場合は Marketplace で同名を検索（2026+ のみ。2024.2–2025.2 では単体インストール不可）。
settings.web.jcef.step.restart=IDE を完全に再起動してください（「ディスクから再読み込み」だけでは不十分です）。
settings.web.jcef.step.jbr=JCEF 付き JetBrains Runtime で起動しているか確認：ヘルプ → バージョン情報（または Find Action →「Choose Boot Java Runtime」）。JCEF 無しの素の OpenJDK を避けてください。
settings.web.jcef.step.registry=Find Action → Registry… → ide.browser.jcef.enabled にチェック。意図的に無効にした場合のみ外してください。
settings.web.jcef.step.rebuild=リポジトリで npm run build:settings-ui && ./gradlew :plugin:buildPlugin（または ./scripts/package-local.sh）の後、ZIP を再インストール。
settings.web.jcef.step.reinstall=Marketplace または署名済み GitHub Release ZIP から新しいビルドをインストール。
settings.web.jcef.noteCompletion=補足：プロファイル保存済みならインライン補完にこのパネルは不要です。設定/ログだけが JCEF を必要とします。
settings.web.jcef.env=環境: {0}
settings.web.jcef.envFlags=JCEF クラス: {0} · Web Browser (JCEF) モジュール: {1} · Registry ide.browser.jcef.enabled: {2}
settings.web.jcef.moduleBundledInPlatform=プラットフォーム/JBR 内蔵
settings.web.jcef.disabled=無効
settings.web.jcef.detail=技術詳細
settings.web.jcef.yes=はい
settings.web.jcef.no=いいえ
settings.web.jcef.unknown=不明
settings.web.jcef.action.plugins=プラグイン設定を開く…
settings.web.jcef.action.plugins.tooltip=Web Browser (JCEF) を有効化できるようプラグイン設定を開きます
settings.web.jcef.action.guide=ユーザーガイドを開く
settings.web.jcef.action.guide.tooltip=ブラウザで docs/GUIDE.md を開きます
settings.web.jcef.action.retry=再試行
settings.web.jcef.action.retry.tooltip=JCEF 有効化後に設定パネルを再読み込み
settings.web.jcefDisabled=埋め込みブラウザ（JCEF）が無効です（Registry / ヘッドレス）。JCEF を有効にして再起動してください。設定画面は Web 専用です。
settings.web.jcefUnavailable=クラスパスに JCEF クラスがありません。IDEA 2026+ では同梱プラグイン「Web Browser (JCEF)」を有効化して再起動してください。2024.2 では JCEF 付き JetBrains Runtime を使用してください。
settings.web.jcefFailed=埋め込み設定ブラウザ（JCEF）の起動に失敗しました。新しい IDE では「Web Browser (JCEF)」が有効か確認してください。詳細は下記を参照してください。
settings.web.bundleMissing=プラグインパッケージに settings-ui バンドルがありません。npm run build:settings-ui の後に ./gradlew :plugin:buildPlugin で再ビルドしてください。
