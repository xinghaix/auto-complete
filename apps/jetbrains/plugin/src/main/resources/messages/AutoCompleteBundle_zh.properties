# JCEF 不可用时的 Swing 恢复面板（不得依赖 JCEF）
settings.web.jcef.title=设置页需要内嵌浏览器（JCEF）
settings.web.jcef.intro=Auto Complete 的设置与日志使用内嵌 Chromium 面板（JCEF）。若已保存过配置，行内补全仍可工作；在 JCEF 可用之前无法打开本面板。
settings.web.jcef.whatMissing=缺少什么
settings.web.jcef.missing.classes=类路径中找不到 JCEF UI 类。IntelliJ 2026+ 请启用自带插件「Web Browser (JCEF)」（id: com.intellij.modules.jcef）。2024.2–2025.x 请使用官方 IDE 自带的、含 JCEF 的 JetBrains Runtime。
settings.web.jcef.missing.legacyJbr=类路径中找不到 JCEF UI 类。IntelliJ 2024.2–2025.2 中 JCEF 内置于 JetBrains Runtime（JBR），不是独立插件。请将启动运行时切换为包含 JCEF 的 JetBrains Runtime。
settings.web.jcef.missing.splitPlugin=当前 IntelliJ 2026.2+ 环境中，内置插件「Web Browser (JCEF)」（id: com.intellij.modules.jcef）已禁用或未加载。请前往「设置 → 插件 → 已安装」启用该插件并重启 IDE。
settings.web.jcef.missing.modulePresentButClasses=已检测到「Web Browser (JCEF)」模块，但仍无法加载 JBCef 类。请确认插件已启用并完全重启 IDE。若仍失败，请通过「帮助 → 查找操作 → Choose Boot Java Runtime」选择带 JCEF 的 JetBrains Runtime。
settings.web.jcef.missing.registryOff=IDE Registry 中 ide.browser.jcef.enabled 已关闭（或当前环境禁止 JCEF）。
settings.web.jcef.missing.mountFailed=已找到 JCEF 类，但内嵌浏览器启动失败（被禁用、无头环境或原生初始化错误）。
settings.web.jcef.missing.bundle=当前插件包中缺少 settings-ui 前端资源（开发环境需重新打包）。
settings.web.jcef.stepsTitle=请按下列步骤处理
settings.web.jcef.step.enablePlugin=设置 → 插件 → 已安装：启用「Web Browser (JCEF)」。若没有，在插件市场搜索同名插件（仅 2026+；2024.2–2025.2 不可单独安装）。
settings.web.jcef.step.restart=完全重启 IDE（不要只「从磁盘重新加载」）。
settings.web.jcef.step.jbr=确认 IDE 使用带 JCEF 的 JetBrains Runtime：帮助 → 关于（或查找操作 →「Choose Boot Java Runtime」）。请避免使用不含 JCEF 的普通 OpenJDK。
settings.web.jcef.step.registry=查找操作 → Registry… → 勾选 ide.browser.jcef.enabled。仅在你有意关闭浏览器时才取消勾选。
settings.web.jcef.step.rebuild=在仓库中执行：npm run build:settings-ui && ./gradlew :plugin:buildPlugin（或 ./scripts/package-local.sh），然后重新安装 ZIP。
settings.web.jcef.step.reinstall=从 Marketplace 或 GitHub Release 的签名 ZIP 安装新的插件构建。
settings.web.jcef.noteCompletion=说明：若配置文件已保存，行内补全不依赖本面板；仅「设置 / 日志」需要 JCEF。
settings.web.jcef.env=环境：{0}
settings.web.jcef.envFlags=JCEF 类：{0} · Web Browser (JCEF) 模块：{1} · Registry ide.browser.jcef.enabled：{2}
settings.web.jcef.moduleBundledInPlatform=平台内置/JBR
settings.web.jcef.disabled=已禁用
settings.web.jcef.detail=技术详情
settings.web.jcef.yes=是
settings.web.jcef.no=否
settings.web.jcef.unknown=未知
settings.web.jcef.action.plugins=打开插件设置…
settings.web.jcef.action.plugins.tooltip=打开 IDE 设置并定位到插件，以便启用 Web Browser (JCEF)
settings.web.jcef.action.guide=打开使用指南
settings.web.jcef.action.guide.tooltip=在浏览器中打开 docs/GUIDE.md
settings.web.jcef.action.retry=重试
settings.web.jcef.action.retry.tooltip=启用 JCEF 后再次加载设置面板
settings.web.jcefDisabled=内嵌浏览器（JCEF）当前被禁用（Registry / 无头模式）。请启用 JCEF 后重启。设置界面仅支持 Web。
settings.web.jcefUnavailable=类路径中找不到 JCEF。IDEA 2026+ 请启用自带「Web Browser (JCEF)」插件并重启；2024.2 请使用带 JCEF 的 JetBrains Runtime。
settings.web.jcefFailed=启动内嵌设置浏览器（JCEF）失败。新版 IDE 请检查是否启用「Web Browser (JCEF)」。详情见下方。
settings.web.bundleMissing=插件包中缺少 settings-ui。请先执行 npm run build:settings-ui，再 ./gradlew :plugin:buildPlugin。
