# JCEF 不可用时的 Swing 恢复面板（不得依赖 JCEF）
settings.web.jcef.title=设置页需要内嵌浏览器（JCEF）
settings.web.jcef.intro=Auto Complete 的设置与日志使用内嵌 Chromium 面板（JCEF）。若已保存过配置，行内补全仍可工作；在 JCEF 可用之前无法打开本面板。
settings.web.jcef.whatMissing=缺少什么
settings.web.jcef.missing.classes=类路径中找不到 JCEF UI 类。IntelliJ 2026+ 请安装/启用自带插件「Web Browser (JCEF)」（id: com.intellij.modules.jcef）。2024.2–2025.x 请使用官方 IDE 自带的、含 JCEF 的 JetBrains Runtime。
settings.web.jcef.missing.modulePresentButClasses=已检测到「Web Browser (JCEF)」模块，但仍无法加载 JBCef 类。启用插件后请完全重启 IDE。若仍失败：重装 IDE，或通过「查找操作 → Choose Boot Java Runtime」选择带 JCEF 的 JetBrains Runtime。
settings.web.jcef.missing.registryOff=IDE Registry 中 ide.browser.jcef.enabled 已关闭（或当前环境禁止 JCEF）。
settings.web.jcef.missing.mountFailed=已找到 JCEF 类，但内嵌浏览器启动失败（被禁用、无头环境或原生初始化错误）。
settings.web.jcef.missing.bundle=当前插件包中缺少 settings-ui 前端资源（开发环境需重新打包）。
settings.web.jcef.stepsTitle=请按下列步骤处理
settings.web.jcef.step.enablePlugin=设置 → 插件 → 已安装：启用「Web Browser (JCEF)」。若没有，在插件市场搜索同名插件（仅 2026+；2024.2 不可单独安装）。
settings.web.jcef.step.restart=完全重启 IDE（不要只「从磁盘重新加载」）。
settings.web.jcef.step.jbr=确认 IDE 使用带 JCEF 的 JetBrains Runtime：帮助 → 关于（或查找操作 →「Choose Boot Java Runtime」）。2024.2–2025.x 请避免使用不含 JCEF 的普通 OpenJDK。
settings.web.jcef.step.registry=查找操作 → Registry… → 勾选 ide.browser.jcef.enabled。仅在你有意关闭浏览器时才取消勾选。
settings.web.jcef.step.rebuild=在仓库中执行：npm run build:settings-ui && ./gradlew :plugin:buildPlugin（或 ./scripts/package-local.sh），然后重新安装 ZIP。
settings.web.jcef.step.reinstall=从 Marketplace 或 GitHub Release 的签名 ZIP 安装新的插件构建。
settings.web.jcef.noteCompletion=说明：若配置文件已保存，行内补全不依赖本面板；仅「设置 / 日志」需要 JCEF。
