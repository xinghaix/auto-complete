# Swing recovery when JCEF is unavailable
settings.web.jcef.title=설정 패널에는 내장 브라우저(JCEF)가 필요합니다
settings.web.jcef.intro=Auto Complete 설정과 로그는 내장 Chromium(JCEF) 패널을 사용합니다. 프로필이 이미 있다면 인라인 완성은 동작할 수 있지만, JCEF를 사용할 수 있을 때까지 이 패널은 열 수 없습니다.
settings.web.jcef.whatMissing=부족한 항목
settings.web.jcef.missing.classes=클래스패스에 JCEF UI 클래스가 없습니다. IntelliJ 2026+에서는 번들 플러그인 “Web Browser (JCEF)”(id: com.intellij.modules.jcef)를 활성화하세요. 2024.2–2025.x에서는 JCEF가 포함된 JetBrains Runtime(공식 IDE)을 사용하세요.
settings.web.jcef.missing.legacyJbr=클래스패스에 JCEF UI 클래스가 없습니다. IntelliJ 2024.2–2025.2에서는 JCEF가 별도 플러그인이 아니라 JetBrains Runtime(JBR)에 내장되어 있습니다. JCEF가 포함된 JetBrains Runtime으로 부트 런타임을 전환하세요.
settings.web.jcef.missing.splitPlugin=이 IntelliJ 2026.2+ 빌드에서는 번들 플러그인 “Web Browser (JCEF)”(id: com.intellij.modules.jcef)가 비활성화되었거나 로드되지 않았습니다. 설정 → 플러그인 → 설치됨에서 활성화한 뒤 IDE를 다시 시작하세요.
settings.web.jcef.missing.modulePresentButClasses=“Web Browser (JCEF)” 모듈은 있으나 JBCef 클래스에 접근할 수 없습니다. 플러그인 활성화 후 IDE를 완전히 다시 시작하세요. 계속되면 Find Action → “Choose Boot Java Runtime”에서 JCEF Runtime을 선택하세요.
settings.web.jcef.missing.registryOff=Registry 플래그 ide.browser.jcef.enabled 가 꺼져 있습니다(또는 이 환경에서 JCEF가 차단됨).
settings.web.jcef.missing.mountFailed=JCEF 클래스는 있으나 내장 브라우저 시작에 실패했습니다(비활성, 헤드리스, 네이티브 초기화 오류).
settings.web.jcef.missing.bundle=이 플러그인 패키지에 settings-ui 번들이 없습니다(개발 시 재빌드 필요).
settings.web.jcef.stepsTitle=조치 방법
settings.web.jcef.step.enablePlugin=설정 → 플러그인 → 설치됨: “Web Browser (JCEF)” 활성화. 없으면 Marketplace에서 같은 이름 검색(2026+만 해당, 2024.2–2025.2는 단독 설치 불가).
settings.web.jcef.step.restart=IDE를 완전히 다시 시작하세요(“디스크에서 다시 로드”만으로는 부족합니다).
settings.web.jcef.step.jbr=JCEF가 포함된 JetBrains Runtime인지 확인: 도움말 → 정보(또는 Find Action → “Choose Boot Java Runtime”). JCEF 없는 일반 OpenJDK를 피하세요.
settings.web.jcef.step.registry=Find Action → Registry… → ide.browser.jcef.enabled 체크. 의도적으로 끈 경우에만 해제하세요.
settings.web.jcef.step.rebuild=저장소에서 npm run build:settings-ui && ./gradlew :plugin:buildPlugin(또는 ./scripts/package-local.sh) 후 ZIP 재설치.
settings.web.jcef.step.reinstall=Marketplace 또는 서명된 GitHub Release ZIP에서 새 빌드를 설치하세요.
settings.web.jcef.noteCompletion=참고: 프로필이 저장되어 있으면 인라인 완성은 이 패널 없이도 동작합니다. 설정/로그만 JCEF가 필요합니다.
settings.web.jcef.env=환경: {0}
settings.web.jcef.envFlags=JCEF 클래스: {0} · Web Browser (JCEF) 모듈: {1} · Registry ide.browser.jcef.enabled: {2}
settings.web.jcef.moduleBundledInPlatform=플랫폼/JBR 내장
settings.web.jcef.disabled=비활성화됨
settings.web.jcef.detail=기술 상세
settings.web.jcef.yes=예
settings.web.jcef.no=아니요
settings.web.jcef.unknown=알 수 없음
settings.web.jcef.action.plugins=플러그인 설정 열기…
settings.web.jcef.action.plugins.tooltip=Web Browser (JCEF)를 켤 수 있도록 플러그인 설정을 엽니다
settings.web.jcef.action.guide=사용 가이드 열기
settings.web.jcef.action.guide.tooltip=브라우저에서 docs/GUIDE.md 열기
settings.web.jcef.action.retry=다시 시도
settings.web.jcef.action.retry.tooltip=JCEF 활성화 후 설정 패널 다시 로드
settings.web.jcefDisabled=내장 브라우저(JCEF)가 비활성화되었습니다(Registry / 헤드리스). JCEF를 활성화하고 다시 시작하세요. 설정 UI는 Web 전용입니다.
settings.web.jcefUnavailable=클래스패스에 JCEF 클래스가 없습니다. IDEA 2026+에서는 번들 플러그인 “Web Browser (JCEF)”를 활성화하고 다시 시작하세요. 2024.2에서는 JCEF가 포함된 JetBrains Runtime을 사용하세요.
settings.web.jcefFailed=내장 설정 브라우저(JCEF) 시작에 실패했습니다. 최신 IDE에서는 “Web Browser (JCEF)”가 활성화되어 있는지 확인하세요. 아래 세부 정보를 참고하세요.
settings.web.bundleMissing=플러그인 패키지에 settings-ui 번들이 없습니다. npm run build:settings-ui 실행 후 ./gradlew :plugin:buildPlugin으로 다시 빌드하세요.
